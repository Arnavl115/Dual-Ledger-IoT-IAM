<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="90" viewBox="0 0 800 90" role="img" aria-labelledby="title desc">
  <title id="title">Canonical signed request message</title>
  <desc id="desc">m equals UTF-8 encoding of the device identifier, action, and timestamp separated by colons.</desc>
  <rect width="800" height="90" fill="#ffffff"/>
  <text x="400" y="58" text-anchor="middle" fill="#000000" font-family="Cambria Math, STIX Two Math, Times New Roman, serif" font-size="34">
    <tspan font-style="italic">m</tspan>
    <tspan> = UTF-8(</tspan>
    <tspan font-style="italic">id</tspan>
    <tspan> &#x2225; ":" &#x2225; </tspan>
    <tspan font-style="italic">a</tspan>
    <tspan> &#x2225; ":" &#x2225; </tspan>
    <tspan font-style="italic">t</tspan>
    <tspan>)</tspan>
  </text>
</svg>
