<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Dual-ledger simulator registration and rollback</title><desc id="desc">Registration commits to Fabric, IOTA, PostgreSQL, and the simulator key store, compensating completed steps in reverse order after a failure.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#334155"/></marker><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.t{font-size:24px;font-weight:700}.h{font-size:15px;font-weight:700}.n{font-size:12px;fill:#475569}.box{fill:#f8fafc;stroke:#cbd5e1}.step{fill:#eff6ff;stroke:#2563eb}.success{fill:#ecfdf5;stroke:#047857}.rollback{fill:#fff1f2;stroke:#be123c}.line{stroke:#334155;stroke-width:1.8;marker-end:url(#a)}.dash{stroke:#be123c;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="760" fill="#fff"/><text x="50" y="45" class="t">Dual-ledger registration with compensating rollback</text><text x="50" y="70" class="n">Implemented by deviceStore.registerSimulatorDevice; each device operation is serialized by device ID.</text>
  <rect x="55" y="105" width="190" height="70" rx="9" class="box"/><text x="150" y="134" text-anchor="middle" class="h">Preconditions</text><text x="150" y="155" text-anchor="middle" class="n">Both ledgers enabled</text><text x="150" y="170" text-anchor="middle" class="n">ID absent everywhere</text>
  <rect x="285" y="105" width="170" height="70" rx="9" class="step"/><text x="370" y="134" text-anchor="middle" class="h">Generate keypair</text><text x="370" y="155" text-anchor="middle" class="n">ECDSA P-256</text>
  <rect x="495" y="105" width="170" height="70" rx="9" class="step"/><text x="580" y="134" text-anchor="middle" class="h">Fabric commit</text><text x="580" y="155" text-anchor="middle" class="n">RegisterDevice</text>
  <rect x="705" y="105" width="170" height="70" rx="9" class="step"/><text x="790" y="134" text-anchor="middle" class="h">IOTA commit</text><text x="790" y="155" text-anchor="middle" class="n">Create notarization</text>
  <rect x="915" y="105" width="190" height="70" rx="9" class="step"/><text x="1010" y="134" text-anchor="middle" class="h">Persist projection</text><text x="1010" y="155" text-anchor="middle" class="n">PostgreSQL if configured</text>
  <path d="M245 140H285M455 140H495M665 140H705M875 140H915" class="line"/>
  <path d="M1010 175V230H790" class="line"/><rect x="600" y="210" width="190" height="70" rx="9" class="success"/><text x="695" y="239" text-anchor="middle" class="h">Store private key</text><text x="695" y="260" text-anchor="middle" class="n">Only after durable commits</text>
  <path d="M600 245H430" class="line"/><rect x="220" y="210" width="210" height="70" rx="9" class="success"/><text x="325" y="239" text-anchor="middle" class="h">Registration complete</text><text x="325" y="260" text-anchor="middle" class="n">Backend = FABRIC+IOTA</text>
  <text x="50" y="350" class="h">Failure at any commit</text><text x="50" y="372" class="n">Track only completed steps, then compensate in reverse order. Attempt every applicable rollback and report all rollback failures.</text>
  <rect x="905" y="415" width="200" height="70" rx="9" class="rollback"/><text x="1005" y="443" text-anchor="middle" class="h">Remove simulator key</text><text x="1005" y="465" text-anchor="middle" class="n">if stored</text>
  <rect x="665" y="415" width="200" height="70" rx="9" class="rollback"/><text x="765" y="443" text-anchor="middle" class="h">Delete projection</text><text x="765" y="465" text-anchor="middle" class="n">if PostgreSQL committed</text>
  <rect x="425" y="415" width="200" height="70" rx="9" class="rollback"/><text x="525" y="443" text-anchor="middle" class="h">Delete IOTA object</text><text x="525" y="465" text-anchor="middle" class="n">if IOTA committed</text>
  <rect x="185" y="415" width="200" height="70" rx="9" class="rollback"/><text x="285" y="443" text-anchor="middle" class="h">Delete Fabric state</text><text x="285" y="465" text-anchor="middle" class="n">if Fabric committed</text>
  <path d="M905 450H865M665 450H625M425 450H385" class="dash"/>
  <rect x="425" y="570" width="350" height="82" rx="9" class="box"/><text x="600" y="600" text-anchor="middle" class="h">Return registration error</text><text x="600" y="623" text-anchor="middle" class="n">Append each compensation failure to the message</text><text x="600" y="641" text-anchor="middle" class="n">so partial state is visible to operators</text>
  <path d="M285 485V535H600V570" class="dash"/>
  <text x="600" y="710" text-anchor="middle" class="n">Rollback is compensating, not atomic: failed compensation requires operator reconciliation.</text>
</svg>
