<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Dual-ledger IoT identity and access gateway architecture</title>
  <desc id="desc">IoT devices and administrators use an Express gateway that authorizes against Fabric or IOTA and persists projections and audit records in PostgreSQL.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#334155"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>
      text{font-family:Inter,Arial,sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.subtitle{font-size:13px;fill:#64748b}.label{font-size:16px;font-weight:700}.detail{font-size:12px;fill:#475569}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}.client{fill:#fff;stroke:#64748b;stroke-width:1.5}.gateway{fill:#172554;stroke:#1e3a8a;stroke-width:2}.gatewayText{fill:#fff}.fabric{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.iota{fill:#f0fdfa;stroke:#0f766e;stroke-width:2}.data{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}.caption{font-size:11px;fill:#64748b}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text x="60" y="52" class="title">Dual-ledger IoT identity and access gateway</text>
  <text x="60" y="76" class="subtitle">Authoritative identity state on a selected ledger; durable administration, projection, replay protection, and audit data off-chain</text>

  <rect x="45" y="112" width="230" height="508" rx="16" class="group"/>
  <text x="68" y="142" class="label">Clients</text>
  <rect x="68" y="174" width="184" height="112" rx="10" class="client" filter="url(#shadow)"/>
  <text x="160" y="208" text-anchor="middle" class="label">IoT device</text>
  <text x="160" y="233" text-anchor="middle" class="detail">P-256 private key</text>
  <text x="160" y="253" text-anchor="middle" class="detail">Signed access request</text>
  <rect x="68" y="402" width="184" height="112" rx="10" class="client" filter="url(#shadow)"/>
  <text x="160" y="436" text-anchor="middle" class="label">Admin console</text>
  <text x="160" y="461" text-anchor="middle" class="detail">React application</text>
  <text x="160" y="481" text-anchor="middle" class="detail">Supabase Auth session</text>

  <rect x="355" y="112" width="360" height="508" rx="16" class="group"/>
  <text x="378" y="142" class="label">Application boundary</text>
  <rect x="386" y="174" width="298" height="340" rx="14" class="gateway" filter="url(#shadow)"/>
  <text x="535" y="211" text-anchor="middle" class="label gatewayText">Express API gateway</text>
  <line x1="412" y1="230" x2="658" y2="230" stroke="#6475a4"/>
  <text x="414" y="262" class="detail gatewayText">1  Validate payload and timestamp</text>
  <text x="414" y="294" class="detail gatewayText">2  Resolve authoritative device state</text>
  <text x="414" y="326" class="detail gatewayText">3  Verify ECDSA signature</text>
  <text x="414" y="358" class="detail gatewayText">4  Claim replay-safe request ID</text>
  <text x="414" y="390" class="detail gatewayText">5  Enforce ACTIVE / REVOKED policy</text>
  <text x="414" y="422" class="detail gatewayText">6  Persist decision before response</text>
  <line x1="412" y1="446" x2="658" y2="446" stroke="#6475a4"/>
  <text x="535" y="476" text-anchor="middle" class="detail gatewayText">Fabric, IOTA, and PostgreSQL adapters</text>

  <rect x="795" y="112" width="360" height="508" rx="16" class="group"/>
  <text x="818" y="142" class="label">Trust and data services</text>
  <rect x="825" y="174" width="300" height="104" rx="10" class="fabric" filter="url(#shadow)"/>
  <text x="975" y="207" text-anchor="middle" class="label">Hyperledger Fabric</text>
  <text x="975" y="232" text-anchor="middle" class="detail">Device registry chaincode</text>
  <text x="975" y="252" text-anchor="middle" class="detail">Identity, status, history, events</text>
  <rect x="825" y="308" width="300" height="104" rx="10" class="iota" filter="url(#shadow)"/>
  <text x="975" y="341" text-anchor="middle" class="label">IOTA Notarization</text>
  <text x="975" y="366" text-anchor="middle" class="detail">Per-device notarization object</text>
  <text x="975" y="386" text-anchor="middle" class="detail">Identity and lifecycle state</text>
  <rect x="825" y="442" width="300" height="104" rx="10" class="data" filter="url(#shadow)"/>
  <text x="975" y="475" text-anchor="middle" class="label">Supabase PostgreSQL</text>
  <text x="975" y="500" text-anchor="middle" class="detail">Admin auth, device projection</text>
  <text x="975" y="520" text-anchor="middle" class="detail">Replay claims and access audit</text>

  <path d="M252 230H386" class="flow"/><text x="319" y="217" text-anchor="middle" class="caption">HTTPS</text>
  <path d="M252 458H386" class="flow"/><text x="319" y="445" text-anchor="middle" class="caption">Admin API</text>
  <path d="M684 226H825" class="flow"/><text x="754" y="213" text-anchor="middle" class="caption">selected route</text>
  <path d="M684 344H825" class="flow"/>
  <path d="M684 474H825" class="flow dashed"/><text x="754" y="461" text-anchor="middle" class="caption">projection + audit</text>
  <text x="600" y="675" text-anchor="middle" class="subtitle">Solid lines: request and ledger operations  •  Dashed line: off-chain persistence</text>
</svg>
